
<!DOCTYPE html>
<html>
<head>
    <title>Bon mua</title>

    <style>
        body {
            display: flex;
            justify-content: center;
        }

        article {
            width: 600px;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
            padding: 24px;
            text-align: center;
        }

        h1 {
            color: #D40000;
            background-color: #FFDDE9;
            font-size: 26px;
            padding: 6px;
        }

        .kho {
            font-style: italic;
            line-height: 1.7;
        }

        .xanh {
            color: #0033CC;
        }

        .do {
            color: #D40000;
        }

        hr {
            width: 55%;
            border: 1px solid #0033CC;
        }
    </style>
</head>

<body>

    <article>

        <h1>BỐN MÙA</h1>

        <p class="kho xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr>

        <p class="kho do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>

        <p class="kho xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>

    </article>

</body>
</html>
